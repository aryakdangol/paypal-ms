server.port=8080

spring.application.name = auth-gateway
spring.cloud.gateway.enabled=true
# Gateway Routes - payment-service
spring.cloud.gateway.mvc.routes[0].id=payment-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.mvc.routes[0].filters[0]=RewritePath=/api/payments/(?<segment>.*),/payments/${segment}
spring.cloud.gateway.mvc.routes[0].filters[1]=CircuitBreaker=name=paymentCircuitBreaker,fallbackUri=/fallback/payment


# Gateway Routes - webhook-service
spring.cloud.gateway.mvc.routes[1].id=notification-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/notification/**
spring.cloud.gateway.mvc.routes[1].filters[0]=RewritePath=/api/notification/(?<segment>.*),/notification/${segment}
spring.cloud.gateway.mvc.routes[1].filters[1]=CircuitBreaker=name=notificationCircuitBreaker,fallbackUri=/fallback/notification
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.springframework.core.env=DEBUG

resilience4j.circuitbreaker.instances.paymentCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.failureRateThreshold=5
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.notificationCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.failureRateThreshold=5
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.waitDurationInOpenState=10s