server.port=8080

spring.application.name = auth-gateway
spring.cloud.gateway.enabled=true
# Gateway Routes - payment-service
spring.cloud.gateway.mvc.routes[0].id=payment-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.mvc.routes[0].filters[0]=RewritePath=/api/payments/(?<segment>.*),/payments/${segment}
spring.cloud.gateway.mvc.routes[0].filters[1]=AddRequestHeader=Authorization,#{request.headers['Authorization']?[0]}

# Gateway Routes - webhook-service
spring.cloud.gateway.routes[1].id=webhook-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/webhooks/**

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dial